[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-data-mcp"
version = "1.0.0"
description = "MCP Server for Quant Data API (A-share market data)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Zizhenghua", email = "support@zizhenghua.com"}
]
keywords = ["mcp", "quant", "stock", "a-share", "finance", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://zizhenghua.com"
Repository = "https://github.com/Zizhenghua/quant-data-mcp"
Issues = "https://github.com/Zizhenghua/quant-data-mcp/issues"

[project.scripts]
quant-data-mcp = "quant_data_mcp.server:main"

[tool.setuptools.packages.find]
include = ["quant_data_mcp*"]